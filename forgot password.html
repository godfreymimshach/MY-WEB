
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MIMSCO Logistics</title>

    <link rel="stylesheet" href="./style.css">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="signup-page">

    <div class="signup-container">

        <h1>FORGOT PASSWORD?</h1>

        <p>Enter your registered email address. We will send you a password reset link.</p>

        <form id="forgotPasswordForm">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <button type="submit" class="create-account">
                SEND RESET LINK
            </button>

            <p id="resetMessage"></p>

            <p class="login-link">
                <a href="login.html">BACK TO LOGIN</a>
            </p>

        </form>

    </div>

    <script type="module" src="./forgot-password.js"></script>

</body>
</html>
