<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | MIMSCO Logistics</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>
<body class="signup-page">

    <div class="signup-container">

        <h1>WELCOME BACK</h1>

        <form id="loginForm">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <div class="password-field">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="button" id="showLoginPassword">
                    ◉
                </button>

            </div>

            <button type="submit" class="create-account">
                LOGIN
            </button>

            <p id="loginMessage"></p>

            <p class="login-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

            <p class="login-link">
                <a href="MRL.html">Back to Home</a>
            </p>

        </form>

    </div>

    <script>

        const password = document.getElementById("loginPassword");

        document.getElementById("showLoginPassword").addEventListener("click", function() {

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }

        });

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("loginMessage").textContent =
                "Login form ready. Supabase authentication will be connected next.";

        });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</body>
</html>
